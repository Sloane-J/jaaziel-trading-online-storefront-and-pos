<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — Jaaziel Trading</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background: #ffffff;
        color: #171717;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        text-align: center;
        max-width: 360px;
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        color: #335c30;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      p {
        font-size: 0.9rem;
        color: #666;
        line-height: 1.5;
      }

      .status {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #90b96d;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>

      <h1>You're offline</h1>
      <p>
        Check your internet connection. We'll reconnect automatically once
        you're back online.
      </p>

      <p class="status" id="status">Waiting for connection…</p>
    </div>

    <script>
      function checkConnection() {
        if (navigator.onLine) {
          window.location.reload();
        }
      }

      window.addEventListener("online", checkConnection);

      // Fallback poll, in case the 'online' event doesn't fire reliably
      // on all devices/networks.
      setInterval(checkConnection, 3000);
    </script>
  </body>
</html>
